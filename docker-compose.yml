# All ${VAR} values are read from `.env` in this directory (Compose default env file).
services:
  mysql:
    image: mysql:8.4
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
#    ports:
#      - "${MYSQL_PORT}:3306"
    volumes:
      - vacaypay_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./nextserver
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: root
      DB_PASS: ${DB_PASS}
    volumes:
      - ${APK_FILE}:/apk/download.apk:ro
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  vacaypay_mysql: